name: Checks

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v26
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run linters
        run: |
          nix develop --ignore-environment --keep HOME . --command task lint
      # Adding golang-ci lint as a separate step as the Nix package is currently broken
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.1.6
          args: --timeout=10m

  test:
    # The Ubuntu image has been downgraded and pinned for the `test` and `generated` jobs as they are broken on 24.04
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v26
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run tests
        run: |
          nix develop --ignore-environment --keep HOME . --command task test

  blazor-ui:
    name: Build Blazor UI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: preview
      - name: Restore
        working-directory: blazor-ui
        run: dotnet restore Bitmagnet.WebUI.csproj
      - name: Build
        working-directory: blazor-ui
        run: dotnet build Bitmagnet.WebUI.csproj -c Release --no-restore

  # This job runs all code generations, to check that everything is correctly committed
  generated:
    runs-on: ubuntu-22.04
    services:
      # Label used to access the service container
      postgres:
        # Docker Hub image
        image: postgres:16-alpine
        # Provide the password for postgres
        env:
          PGUSER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bitmagnet
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v26
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply database migrations and generate code
        run: |
          nix develop --ignore-environment --keep HOME --keep POSTGRES_PASSWORD . --command task migrate
          nix develop --ignore-environment --keep HOME --keep POSTGRES_PASSWORD . --command task gen
          nix develop --ignore-environment --keep HOME . --command go fmt ./...
        env:
          POSTGRES_PASSWORD: postgres
      - name: Check nothing changed
        run: git diff --exit-code
